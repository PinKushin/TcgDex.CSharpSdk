version: 2

# NuGetAudit already fails the build on a known-vulnerable package, which is
# detection. This is maintenance: it moves versions before an advisory exists,
# and it watches the GitHub Actions that nothing else does.
#
# Everything is grouped. Ungrouped, a quiet week is six action bumps and a busy
# one is a dozen package PRs, and a review queue nobody reads is the same as no
# review at all.
updates:
  # ----- GitHub Actions -----
  #
  # The reason this entry matters more than it looks. Actions are pinned by
  # major tag (`@v7`), so they float silently within a major and then stop
  # dead when one is retired — the failure arrives on GitHub's schedule rather
  # than ours. This repository's own policy is that deprecation notices get
  # fixed when they appear, not when they break, and without Dependabot nothing
  # surfaces them.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      # Off the hour, matching the CI cron, so this does not join the queue
      # every scheduled job in the world starts in.
      time: "06:40"
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
    labels: ["dependencies", "github-actions"]

  # ----- NuGet -----
  #
  # Versions live in Directory.Packages.props under central package management,
  # which Dependabot understands and edits in place.
  #
  # Runtime dependencies are pinned per target framework to the *lowest* version
  # that satisfies each, because a library's floor becomes every consumer's
  # floor — a net8.0 app should not be forced onto the 10.x Microsoft.Extensions
  # graph by taking a dependency on this. Dependabot does not know that, so
  # **a major bump on Microsoft.Extensions.* needs a human decision, not a
  # merge.** Grouping them separately is what makes that visible.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:40"
    open-pull-requests-limit: 5
    groups:
      # Test and tooling packages: no consumer ever sees these, so they can move
      # freely and are the safe half of the queue.
      test-and-tooling:
        patterns:
          - "Microsoft.NET.Test.Sdk"
          - "NUnit*"
          - "Shouldly"
          - "coverlet.*"
          - "PublicApiGenerator"
          - "BenchmarkDotNet"
          - "SharpFuzz"
          - "Newtonsoft.Json"
          - "TCGdex"
      # Everything shipped. Separate because these set the floor for consumers
      # and a major here is a decision rather than an update.
      runtime:
        patterns: ["*"]
        exclude-patterns:
          - "Microsoft.NET.Test.Sdk"
          - "NUnit*"
          - "Shouldly"
          - "coverlet.*"
          - "PublicApiGenerator"
          - "BenchmarkDotNet"
          - "SharpFuzz"
          - "Newtonsoft.Json"
          - "TCGdex"
    # Major bumps on the shipped dependencies are ignored, and this is the one
    # rule here that is not about noise.
    #
    # Dependabot cannot see that Directory.Packages.props deliberately splits
    # these by target framework — net8.0 and netstandard2.0 on the 8.0.x line,
    # net10.0 on 10.x. Its first attempt (PR #3) unified everything on 10.0.10,
    # and **it was green**: built and tested on all three targets. The damage is
    # invisible to CI because it lands on a consumer who does not exist yet — a
    # library's dependency versions become a floor for everyone who takes it, so
    # 10.x here forces a net8.0 app onto the 10.x Microsoft.Extensions graph and
    # conflicts with an ASP.NET Core 8 app pinned to 8.0.x.
    #
    # Patch and minor updates still flow, which is what matters for security
    # fixes. Moving a framework line stays a decision someone makes on purpose.
    ignore:
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Bcl.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.Text.Json"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.Net.Http.Json"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.Diagnostics.DiagnosticSource"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "deps"
    labels: ["dependencies", "nuget"]
