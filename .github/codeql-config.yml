name: TcgDex.CSharpSdk CodeQL config

# The first scan produced 212 alerts and every one of them was in a *.g.cs file
# emitted by System.Text.Json's source generator — 211 `cs/useless-cast-to-self`
# plus one LINQ note, none with a security severity. Zero findings in
# hand-written code.
#
# That is worth excluding rather than tolerating. Alerts nobody can act on train
# everyone to ignore the Security tab, which is where a real finding would
# appear. The casts belong to Microsoft's generator and cannot be changed from
# here; the same reasoning already excludes *.g.cs from the coverage gate, for
# the same reason — a number dominated by generated code stops measuring this
# project.
# Kept, but it is not what does the work: for compiled languages CodeQL cannot
# exclude files the compiler pulls into the build, and the generator emits into
# obj/ during `dotnet build`. Verified — the config loads ("Using configuration
# file input from workflow") and all 211 alerts survived it.
paths-ignore:
  - "**/*.g.cs"
  - "**/obj/**"

query-filters:
  # So this is the mechanism that actually works. The rule fires 211 times and
  # every instance is in a System.Text.Json-generated file; there are none in
  # hand-written code.
  #
  # Nothing is lost by excluding it: redundant casts in code we own are already
  # caught by IDE0004 with TreatWarningsAsErrors, so the check exists, it just
  # runs in the compiler where the results are actionable.
  - exclude:
      id: cs/useless-cast-to-self

queries:
  # A superset of the default suite. Worth the extra noise for a library this
  # size, and it is the setting that reports taint-flow issues rather than only
  # the obvious ones.
  - uses: security-and-quality
