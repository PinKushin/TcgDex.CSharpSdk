name: Release

# Publishes to nuget.org with Trusted Publishing — no API key exists anywhere.
# The job asks GitHub for a short-lived OIDC token, nuget.org checks it against
# the policy registered for this repository and workflow file, and hands back a
# key valid for one hour.
#
# The filename is load-bearing. The trusted publishing policy names
# `release.yml` specifically; renaming this file silently stops publishing from
# being trusted, and the failure surfaces as a rejected push at the moment you
# are trying to ship.
#
# Two triggers on purpose:
#   workflow_dispatch — the first release, and any time you want to watch it.
#   tag push          — routine releases once it is boring.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, without the leading v (e.g. 0.1.0)"
        required: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # A tag can be pushed to any commit, and the merge's own CI run can still be going when it is. Nothing else ties a
  # release to a green build, and the Test step below cannot stand in: it runs on Linux only, without net472, the
  # coverage gate or the AOT smoke test. This waits for CI on the exact commit and fails the release unless it
  # passed (scripts/Assert-CiPassed.ps1, DECISIONS #42). Its own job so `publish` keeps the same job and file, which
  # the trusted-publishing policy names.
  ci-gate:
    name: CI passed on this commit
    runs-on: ubuntu-latest
    # measured healthy: ~4 min (run 40245471625, 2026-10-25; CI itself takes ~3 min, the gate adds checkout and polling)
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Require a green CI run on ${{ github.sha }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/Assert-CiPassed.ps1 -Sha "${{ github.sha }}" -TimeoutMinutes 15

  publish:
    name: Publish to NuGet
    needs: ci-gate
    runs-on: ubuntu-latest
    permissions:
      # write, not read: the announcement step below creates a GitHub Release
      # through the API, which needs contents:write. The OIDC publish does not
      # need it, so this is the only reason it is elevated.
      contents: write
      # Lets this job request the OIDC token. Without it NuGet/login fails with
      # an unhelpful error, and it is the commonest reason trusted publishing
      # does not work first time.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # Resolved before anything is compiled, because the version has to reach
      # the *build* and not just the pack. Passing it only to `dotnet pack
      # --no-build` would stamp the package 0.2.0 while the assembly inside it
      # still said whatever <Version> holds — a package and a DLL that disagree,
      # which is the kind of thing nobody notices until they are debugging a
      # consumer's stack trace.
      #
      # From the tag when tagged, from the input when dispatched:
      # GITHUB_REF_NAME is the *branch* on a dispatch, so using it
      # unconditionally would try to publish a version called "main".
      - name: Resolve version
        run: |
          VERSION="${{ inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"

          # Fail loudly rather than shipping something unparseable. NuGet would
          # accept a surprising amount of nonsense here.
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$VERSION' is not a semantic version (expected 1.2.3 or 1.2.3-beta.1)"
            exit 1
          fi

          # The tag decides what ships, but a release whose PR forgot the bump
          # leaves <Version> and the changelog describing the previous release.
          CSPROJ=$(grep -oP '(?<=<Version>)[^<]+' TcgDex.CSharpSdk/TcgDex.CSharpSdk.csproj)
          if [ "$CSPROJ" != "$VERSION" ]; then
            echo "::error::publishing $VERSION but TcgDex.CSharpSdk.csproj <Version> is $CSPROJ"
            exit 1
          fi
          if ! grep -qF "## [$VERSION] " CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section"
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "publishing $VERSION"

      - name: Restore
        run: dotnet restore

      # -warnaserror here as well as in CI: a release is exactly the build that
      # should not be the first one to skip the zero-warning rule.
      #
      # ContinuousIntegrationBuild makes the compiler normalise source paths (to /_/...), so the binary and its
      # symbols do not carry this runner's checkout path and a rebuild elsewhere produces the same bytes. It is
      # passed here, to the build that ships, and not set repository-wide: it would also rewrite the paths coverage
      # tooling maps back to files in CI's test run.
      - name: Build
        run: >
          dotnet build --configuration Release --no-restore -warnaserror
          -p:Version="$VERSION" -p:ContinuousIntegrationBuild=true

      # Never publish something that is not green. On this Linux runner that is net8.0 and net10.0: net472, which is
      # what executes the netstandard2.0 asset, is Windows-only (TcgDex.CSharpSdk.Tests.csproj). It, the coverage
      # gate and the AOT smoke test run in CI's own jobs, and the ci-gate job above requires them to have passed on
      # this commit.
      - name: Test
        run: >
          dotnet test TcgDex.CSharpSdk.Tests/TcgDex.CSharpSdk.Tests.csproj
          --configuration Release --no-build

      # Deriving the version from the tag rather than from <Version> in the
      # csproj means the thing you typed is the thing that ships, and the csproj
      # value cannot drift into a lie between releases.
      - name: Pack
        run: >
          dotnet pack TcgDex.CSharpSdk/TcgDex.CSharpSdk.csproj
          --configuration Release --no-build
          -o ./artifacts -p:Version="$VERSION" -p:ContinuousIntegrationBuild=true

      # The package that is about to ship, installed into a fresh project and run on net8.0 and
      # net10.0. Linux cannot run net472, so the netstandard2.0 asset is covered by CI's Windows
      # lane instead. See scripts/Test-Package.ps1.
      - name: Smoke test the package
        shell: pwsh
        run: ./scripts/Test-Package.ps1 -PackageDirectory ./artifacts

      - name: Show what will be published
        run: ls -la ./artifacts

      # Last step before the push. The key lives one hour, so requesting it any
      # earlier risks it expiring mid-workflow.
      #
      # `user` is the nuget.org profile name, NOT an email address — the
      # commonest reason this step fails. It is written literally rather than
      # held in a secret because it is public: it appears as the package owner
      # on every package page and in the trusted publishing policy itself.
      - name: NuGet login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: login
        with:
          user: PinKushin

      # --skip-duplicate makes a re-run harmless when the version already
      # exists, which is what lets the tag push follow a dispatch of the same
      # version without failing.
      - name: Push
        run: >
          dotnet nuget push "./artifacts/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Upload the published package
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: published-package
          path: ./artifacts/*
          if-no-files-found: warn

      # Turn the CHANGELOG.md section for this version into a copy-paste-ready
      # Discord post in the job summary. Consumer-scoped by construction — the
      # changelog already excludes internal, CI and test-only work. Runs only on
      # a successful publish (the implicit success() guard), so nothing is
      # announced that did not actually ship. The `announce` job below posts it
      # through the repository's webhook; this summary stays as the fallback and
      # the preview, for when that secret is unset or the post is refused.
      - name: Build release announcement
        shell: pwsh
        run: |
          $post = ./scripts/New-ReleaseAnnouncement.ps1 -Version "$env:VERSION" -OutputDir "$env:RUNNER_TEMP"
          $summary = @(
            "## Discord announcement for $env:VERSION",
            "",
            "Copy the block below into the tcgdex project channel:",
            "",
            '```text',
            $post,
            '```'
          )
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      # A permanent, formatted home for the same notes. Idempotent: a re-run
      # edits the existing release rather than failing, mirroring the
      # --skip-duplicate on the push above. Tag-triggered runs only — a
      # workflow_dispatch has no tag to attach a release to.
      - name: Create or update the GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release edit "v$VERSION" \
              --title "v$VERSION" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "v$VERSION" \
              --title "v$VERSION" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --verify-tag
          fi

          # The exact .nupkg/.snupkg that went to nuget.org, so the release page
          # carries the real package and not only GitHub's source zips. --clobber
          # keeps a re-run idempotent, like the edit above.
          gh release upload "v$VERSION" ./artifacts/* --clobber

  # A separate job, after the publish: nothing is announced that did not ship, and a Discord failure cannot fail
  # the NuGet publish. It has to be called from here: the release above is created with GITHUB_TOKEN, and GitHub
  # does not start a `release: published` workflow for events that token causes.
  #
  # A Discord failure does redden the run, and "Re-run all jobs" re-runs `publish` too. That is harmless here
  # (--skip-duplicate on the push, `release edit`, --clobber), though `announce` then posts to Discord a second time.
  # If this job is the red one, look at the webhook, not the publish, and re-run only this job to retry the post.
  #
  # Only the one secret it needs is passed, by name, so the called workflow sees no other repository secret.
  announce:
    name: Announce on Discord
    needs: publish
    if: github.event_name == 'push'
    permissions:
      contents: read
    uses: ./.github/workflows/discord-release.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
