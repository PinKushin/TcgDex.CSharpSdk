name: Fuzz

# Not a per-push gate. Fuzzing answers a question that has no fixed running
# time: it explores until it finds something or the budget runs out, so putting
# it in front of every push would either be too short to find anything or too
# slow to tolerate. The deterministic version of this check —
# MalformedResponseTests — runs in the normal suite on every push.
#
# Ubuntu only. libFuzzer and the SharpFuzz instrumentation toolchain are
# Linux-first, and the code under test is platform-independent.
on:
  schedule:
    # Weekly, Tuesday 04:23 UTC. A day off the CI schedule so a failure here is
    # not competing for attention with a failure there, and off the hour to
    # avoid the queue that on-the-hour runs join.
    - cron: "23 4 * * 2"
  workflow_dispatch:
    inputs:
      seconds:
        description: "Fuzzing budget in seconds"
        required: false
        default: "300"

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  fuzz:
    name: Fuzz the response path
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # libfuzzer-dotnet is the bridge between libFuzzer and a .NET process. It
      # is distributed as source, so it is built here rather than downloaded —
      # a prebuilt binary from a third party is exactly the supply-chain risk
      # this repository's own dependency policy declines elsewhere.
      - name: Install clang and build libfuzzer-dotnet
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang
          curl -sSL -o libfuzzer-dotnet.cc \
            https://raw.githubusercontent.com/Metalnem/libfuzzer-dotnet/master/libfuzzer-dotnet.cc
          clang -fsanitize=fuzzer libfuzzer-dotnet.cc -o libfuzzer-dotnet

      - name: Install SharpFuzz
        run: dotnet tool install --global SharpFuzz.CommandLine

      - name: Publish the fuzz target
        run: dotnet publish TcgDex.CSharpSdk.Fuzz -c Release -o fuzz-out

      # The SDK assembly is instrumented, not the harness: coverage feedback
      # has to come from the code under test for the fuzzer to make progress.
      - name: Instrument the SDK
        run: sharpfuzz fuzz-out/TcgDex.CSharpSdk.dll

      # The corpus is the fuzzer's memory, not test data: an input is kept only
      # because it reached code no earlier input reached. Starting from the 17
      # recorded responses every week means spending most of each budget
      # rediscovering paths the last run already found — the first run climbed
      # from 641 features to 1,757 and grew the corpus 17 to 496, and almost all
      # of that would be repeated.
      #
      # Cached rather than committed. Committing it would add 1.3 MB to the
      # repository that grows every single week, for a file nobody reads.
      #
      # The key changes every run so each one saves a new entry, and
      # restore-keys falls back to the most recent previous corpus. A cache miss
      # is not a failure: the seeds below still make the run useful, it just
      # starts further back.
      - name: Restore the corpus
        uses: actions/cache@v4
        with:
          path: corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-

      # The recorded API responses seed it, once per fuzz-target mode.
      #
      # The mode byte is why. The harness multiplexes on the first byte, and
      # every recorded response starts with '{' (0x7B) or '[' (0x5B) — so
      # 123 % 7 = 4 and 91 % 7 = 0, and the raw fixtures only ever seed two of
      # the seven modes. Measured: seeding them raw started at 1,196 features
      # and reached 2,705; prefixing each fixture with each mode byte started at
      # 3,085 and reached 3,990. Proper seeding begins above where the other run
      # ended.
      #
      # Seeds are written every run rather than only on a cache miss, so a
      # corpus minimised by libFuzzer cannot lose the known good inputs. Adding
      # one that is already present costs nothing.
      - name: Seed the corpus
        run: |
          mkdir -p corpus findings
          restored=$(ls corpus | wc -l)
          for fixture in fuzz-out/corpus/*.json; do
            name=$(basename "$fixture" .json)
            for mode in 0 1 2 3 4 5 6; do
              printf "$(printf '\\%03o' "$mode")" | cat - "$fixture" > "corpus/${name}-m${mode}.bin"
            done
          done
          echo "restored $restored from cache, now $(ls corpus | wc -l) inputs"

      - name: Fuzz
        env:
          BUDGET: ${{ github.event.inputs.seconds || '300' }}
        run: |
          ./libfuzzer-dotnet \
            --target_path=fuzz-out/TcgDex.CSharpSdk.Fuzz \
            -max_total_time="$BUDGET" \
            -artifact_prefix=findings/ \
            -print_final_stats=1 \
            corpus

      # Without this the cached corpus grows every week and each run spends more
      # of its budget loading inputs than mutating them. -merge=1 keeps the
      # smallest set that preserves the coverage the whole corpus reaches, so
      # what carries forward is the knowledge rather than the volume.
      #
      # Skipped when the fuzz step failed: a crash means there is a finding to
      # collect, and rewriting the corpus first would be tidying up the evidence.
      - name: Minimise the corpus
        if: success()
        run: |
          before=$(ls corpus | wc -l)
          mkdir -p corpus-min
          ./libfuzzer-dotnet \
            --target_path=fuzz-out/TcgDex.CSharpSdk.Fuzz \
            -merge=1 corpus-min corpus 2>&1 | tail -3
          rm -rf corpus
          mv corpus-min corpus
          echo "minimised $before inputs to $(ls corpus | wc -l)"

      # A crash is written as the exact bytes that caused it, which is a
      # regression fixture rather than a bug report. Uploaded on failure as
      # well as success, since failure is when there is something to collect.
      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-findings
          path: |
            findings/
            corpus/
          if-no-files-found: ignore
