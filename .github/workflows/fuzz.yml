name: Fuzz

# Not a per-push gate. Fuzzing answers a question that has no fixed running
# time: it explores until it finds something or the budget runs out, so putting
# it in front of every push would either be too short to find anything or too
# slow to tolerate. The deterministic version of this check —
# MalformedResponseTests — runs in the normal suite on every push.
#
# Ubuntu only. libFuzzer and the SharpFuzz instrumentation toolchain are
# Linux-first, and the code under test is platform-independent.
on:
  schedule:
    # Weekly, Tuesday 04:23 UTC. A day off the CI schedule so a failure here is
    # not competing for attention with a failure there, and off the hour to
    # avoid the queue that on-the-hour runs join.
    - cron: "23 4 * * 2"
  workflow_dispatch:
    inputs:
      seconds:
        description: "Fuzzing budget in seconds"
        required: false
        default: "300"

permissions:
  # write, because the minimised corpus is published to the `fuzz-corpus`
  # release so the Oracle fuzz box can start from what this run found. Release
  # assets live under Contents.
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  fuzz:
    name: Fuzz the response path
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # libfuzzer-dotnet is the bridge between libFuzzer and a .NET process. It
      # is distributed as source, so it is built here rather than downloaded —
      # a prebuilt binary from a third party is exactly the supply-chain risk
      # this repository's own dependency policy declines elsewhere.
      - name: Install clang and build libfuzzer-dotnet
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang
          curl -sSL -o libfuzzer-dotnet.cc \
            https://raw.githubusercontent.com/Metalnem/libfuzzer-dotnet/master/libfuzzer-dotnet.cc
          clang -fsanitize=fuzzer libfuzzer-dotnet.cc -o libfuzzer-dotnet

      - name: Install SharpFuzz
        run: dotnet tool install --global SharpFuzz.CommandLine

      - name: Publish the fuzz target
        run: dotnet publish TcgDex.CSharpSdk.Fuzz -c Release -o fuzz-out

      # The SDK assembly is instrumented, not the harness: coverage feedback
      # has to come from the code under test for the fuzzer to make progress.
      - name: Instrument the SDK
        run: sharpfuzz fuzz-out/TcgDex.CSharpSdk.dll

      # The corpus is the fuzzer's memory, not test data: an input is kept only
      # because it reached code no earlier input reached. Starting from the 17
      # recorded responses every week means spending most of each budget
      # rediscovering paths the last run already found — the first run climbed
      # from 641 features to 1,757 and grew the corpus 17 to 496, and almost all
      # of that would be repeated.
      #
      # Cached rather than committed. Committing it would add 1.3 MB to the
      # repository that grows every single week, for a file nobody reads.
      #
      # The key changes every run so each one saves a new entry, and
      # restore-keys falls back to the most recent previous corpus. A cache miss
      # is not a failure: the seeds below still make the run useful, it just
      # starts further back.
      - name: Restore the corpus
        uses: actions/cache@v6
        with:
          path: corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-

      # The recorded API responses seed it, once per fuzz-target mode.
      #
      # The mode byte is why. The harness multiplexes on the first byte, and
      # every recorded response starts with '{' (0x7B) or '[' (0x5B) — so
      # 123 % 7 = 4 and 91 % 7 = 0, and the raw fixtures only ever seed two of
      # the seven modes. Measured: seeding them raw started at 1,196 features
      # and reached 2,705; prefixing each fixture with each mode byte started at
      # 3,085 and reached 3,990. Proper seeding begins above where the other run
      # ended.
      #
      # Fold in whatever the Oracle fuzz box has found.
      #
      # The two machines share a corpus through this release asset, because there
      # is no filesystem between them and an Actions cache cannot be read from
      # outside a runner.
      #
      # The point is not speed. Both sides run the same inputs against DIFFERENT
      # architectures — this runner is x64, the box is ARM64. An input discovered
      # on one is otherwise never executed on the other, so a fault that only
      # manifests on one architecture is unreachable from the machine that found
      # the input. Pooling is what makes it reachable.
      #
      # Failure is not fatal: the cache and the seeds below still make the run
      # useful, it just starts further back. `|| true` on a 404 is deliberate —
      # the first ever run has nothing to fetch.
      - name: Fold in the shared corpus
        run: |
          mkdir -p corpus
          before=$(ls corpus | wc -l)
          if curl -fsSL -o shared.tar.zst \
              "https://github.com/${{ github.repository }}/releases/download/fuzz-corpus/corpus.tar.zst"; then
            mkdir -p shared && tar -C shared -xf shared.tar.zst
            cp -n shared/* corpus/ 2>/dev/null || true
            rm -rf shared shared.tar.zst
            echo "shared corpus folded in: $before -> $(ls corpus | wc -l) inputs"
          else
            echo "no shared corpus published yet; continuing with cache and seeds"
          fi

      # Seeds are written every run rather than only on a cache miss, so a
      # corpus minimised by libFuzzer cannot lose the known good inputs. Adding
      # one that is already present costs nothing.
      - name: Seed the corpus
        run: |
          mkdir -p corpus findings
          restored=$(ls corpus | wc -l)
          for fixture in fuzz-out/corpus/*.json; do
            name=$(basename "$fixture" .json)
            for mode in 0 1 2 3 4 5 6; do
              printf "$(printf '\\%03o' "$mode")" | cat - "$fixture" > "corpus/${name}-m${mode}.bin"
            done
          done
          echo "restored $restored from cache, now $(ls corpus | wc -l) inputs"

      # An empty findings directory and a harness that has lost the ability to
      # record one look identical, so this proves the instrument before the
      # measurement is trusted.
      #
      # It is not theatre. On a managed exception SharpFuzz aborts the .NET
      # child and libFuzzer's crash handler never runs, so `-artifact_prefix`
      # writes nothing while the exception prints in full — the run reports the
      # defect and loses the input. The harness therefore saves the input
      # itself, and this step is what checks that it still does.
      #
      # Both directions are required. The positive run must produce a file, and
      # the control must produce none — without the control, a step that wrote
      # a file unconditionally would pass.
      - name: Prove the harness can record a finding
        run: |
          rm -rf selftest-findings && mkdir -p selftest-findings
          printf '\000{}' > selftest-input.bin

          # Positive: every input throws, so one execution must leave a file.
          ( cd selftest-findings && TCGDEX_FUZZ_SELFTEST=1 \
            ../libfuzzer-dotnet \
              --target_path=../fuzz-out/TcgDex.CSharpSdk.Fuzz \
              -runs=1 ../selftest-input.bin ) || true

          found=$(find selftest-findings/findings -type f 2>/dev/null | wc -l)

          if [ "$found" -eq 0 ]; then
            echo "::error::The fuzz harness did not record a finding when every input throws."
            echo "A clean weekly run would therefore be meaningless: no crash could be reported."
            exit 1
          fi

          echo "selftest wrote $found finding(s)"

          # Control: same input, flag unset, must write nothing.
          rm -rf control-findings && mkdir -p control-findings
          ( cd control-findings && ../libfuzzer-dotnet \
              --target_path=../fuzz-out/TcgDex.CSharpSdk.Fuzz \
              -runs=1 ../selftest-input.bin ) || true

          leaked=$(find control-findings/findings -type f 2>/dev/null | wc -l)

          if [ "$leaked" -ne 0 ]; then
            echo "::error::The control run wrote $leaked file(s) with $TCGDEX_FUZZ_SELFTEST unset."
            echo "The file seen above is then not evidence the harness works."
            exit 1
          fi

          echo "control wrote 0 findings, as required"
          rm -rf selftest-findings control-findings selftest-input.bin

      - name: Fuzz
        # The fallback applies ONLY to scheduled runs. A workflow_dispatch always
        # populates inputs.seconds from its declared default, so a manual run
        # takes 300 unless told otherwise, while `schedule` leaves inputs null
        # and lands here.
        #
        # An hour, because the target is not exhausted at fifteen minutes.
        # Measured on the fuzz box, same corpus, same harness:
        #
        #   301s  ->  2,774,637 execs, cov 8,  ft 4220
        #   901s  ->  8,490,851 execs, cov 10, ft 4517
        #
        # Both counters still climbing, so a short budget was leaving findings
        # unfound. This repo is public, so Actions minutes are free and the only
        # real ceiling is the 6-hour job limit.
        env:
          BUDGET: ${{ github.event.inputs.seconds || '3600' }}
        run: |
          ./libfuzzer-dotnet \
            --target_path=fuzz-out/TcgDex.CSharpSdk.Fuzz \
            -max_total_time="$BUDGET" \
            -artifact_prefix=findings/ \
            -print_final_stats=1 \
            corpus

      # The harness writes escaped inputs itself, so a finding can exist even
      # when libFuzzer reported success and the step above exited zero. Checked
      # explicitly rather than left to the artifact upload, where nobody looks.
      - name: Fail if anything escaped
        run: |
          escaped=$(find findings -type f 2>/dev/null | wc -l)

          if [ "$escaped" -ne 0 ]; then
            echo "::error::$escaped input(s) escaped the documented outcome. See the fuzz-findings artifact."
            find findings -type f -printf '  %f  %s bytes\n'
            exit 1
          fi

          echo "no inputs escaped"

      # Without this the cached corpus grows every week and each run spends more
      # of its budget loading inputs than mutating them. -merge=1 keeps the
      # smallest set that preserves the coverage the whole corpus reaches, so
      # what carries forward is the knowledge rather than the volume.
      #
      # Skipped when the fuzz step failed: a crash means there is a finding to
      # collect, and rewriting the corpus first would be tidying up the evidence.
      - name: Minimise the corpus
        if: success()
        run: |
          before=$(ls corpus | wc -l)
          mkdir -p corpus-min
          ./libfuzzer-dotnet \
            --target_path=fuzz-out/TcgDex.CSharpSdk.Fuzz \
            -merge=1 corpus-min corpus 2>&1 | tail -3
          rm -rf corpus
          mv corpus-min corpus
          echo "minimised $before inputs to $(ls corpus | wc -l)"

      # Publish the minimised corpus so the Oracle box starts from what this run
      # found. `if: success()` matters: the escape check above fails the job when
      # something was found, and a crashing run must not overwrite the shared
      # corpus with a partial one.
      #
      # The release is created on first use rather than assumed to exist, so this
      # works on a clean repo. `--clobber` replaces the asset — the upload API
      # refuses a duplicate name rather than overwriting.
      - name: Publish the shared corpus
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -C corpus -cf - . | zstd -19 -T0 -q -o corpus.tar.zst -f

          gh release view fuzz-corpus >/dev/null 2>&1 || gh release create fuzz-corpus \
            --prerelease \
            --title "Fuzz corpus (shared)" \
            --notes "Minimised libFuzzer corpus for \`TcgDex.CSharpSdk.Fuzz\`, shared between the CI runner (x64) and the Oracle fuzz box (ARM64).

          Not a software release. Whichever side finishes most recently overwrites the asset; each side folds it into its own corpus before fuzzing, so coverage accumulates across both architectures.

          Regenerable from the recorded fixtures at any time — this is an optimisation, not data."

          gh release upload fuzz-corpus corpus.tar.zst --clobber
          echo "published $(ls corpus | wc -l) inputs ($(du -h corpus.tar.zst | cut -f1))"

      # A crash is written as the exact bytes that caused it, which is a
      # regression fixture rather than a bug report. Uploaded on failure as
      # well as success, since failure is when there is something to collect.
      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-findings
          path: |
            findings/
            corpus/
          if-no-files-found: ignore
