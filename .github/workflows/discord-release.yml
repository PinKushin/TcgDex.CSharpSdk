name: Announce release on Discord

# Posts one message to a Discord channel announcing a GitHub release, called by release.yml after the NuGet publish (or
# run by hand with a tag). The channel's webhook URL is a SECRET: it lives in the repository secret DISCORD_WEBHOOK_URL
# and nowhere in this repository. Set it once with `gh secret set DISCORD_WEBHOOK_URL`; to stop the posts, delete the
# secret.
#
# Why no third-party action: the post is one curl call, so there is no action to pin or to trust with the URL. The release
# fields are passed through `env:` and into jq with --arg, never interpolated into the script text, so a release title or
# body cannot inject shell. `allowed_mentions` is empty, so a release note that contains @everyone pings nobody.
#
# `workflow_dispatch` with no `tag` posts a clearly marked test message, the control that proves the secret and the
# channel work without publishing a release. With a `tag` it announces that existing release for real.
#
# Why `workflow_call` and not a `release: published` trigger: release.yml creates the GitHub Release with the built-in
# GITHUB_TOKEN, and GitHub does not start workflows from events that token causes, so that trigger never fired for a
# tag-driven release (v0.9.0 was never announced; this workflow had not run once). It is not kept as a second
# trigger either: a release created by hand in the GitHub UI with a new tag would fire it AND the tag push would reach
# release.yml, so the announcement would post twice, the first time before NuGet has the package. Releases are made by
# pushing a tag; to announce one made another way, dispatch this with its tag.

on:
  workflow_call:
    inputs:
      tag:
        description: 'The release to announce, e.g. v0.9.0'
        type: string
        required: true
    secrets:
      DISCORD_WEBHOOK_URL:
        description: 'The channel webhook; passed by name, not inherited, so this job sees no other secret'
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: 'Announce this existing release for real (e.g. v0.9.0). Empty posts the test message'
        type: string
        default: ''
      dry_run:
        description: 'Print the payload instead of posting it (needs no secret)'
        type: boolean
        default: false
      body:
        description: 'Test body for the message (manual runs only)'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - name: Post to Discord
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
          DRY_RUN: ${{ inputs.dry_run }}
          TEST_BODY: ${{ inputs.body }}
          INPUT_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$DRY_RUN" != "true" ] && [ -z "$WEBHOOK_URL" ]; then
            # Called from release.yml with no secret set: warn and succeed, so an unset webhook does not turn every
            # release red (the job summary in release.yml carries the post to paste by hand). A person who ran this
            # by hand is asking for a post, so for them it is an error.
            if [ "$EVENT" = "workflow_dispatch" ]; then
              echo "::error::the repository secret DISCORD_WEBHOOK_URL is not set"
              exit 1
            fi
            echo "::warning::the repository secret DISCORD_WEBHOOK_URL is not set, so nothing was posted to Discord"
            exit 0
          fi

          if [ -n "$INPUT_TAG" ]; then
            # A tag that starts with "-" would be read by gh as a flag. Fails, does not inject; say so plainly.
            case "$INPUT_TAG" in v[0-9]*) ;; *) echo "::error::tag '$INPUT_TAG' does not look like a version tag (v1.2.3)"; exit 1 ;; esac

            # Read the release back rather than passing its text in, so there is one source for the fields and a
            # tag that does not exist fails here, loudly, instead of posting an empty message.
            release=$(gh release view "$INPUT_TAG" --repo "$REPO" --json tagName,name,url,body,isPrerelease)
            TAG=$(jq -r '.tagName' <<<"$release"); NAME=$(jq -r '.name // ""' <<<"$release")
            URL=$(jq -r '.url' <<<"$release"); BODY=$(jq -r '.body // ""' <<<"$release")
            PRERELEASE=$(jq -r '.isPrerelease' <<<"$release")
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            TAG="test"; NAME="Test message from the release workflow"; URL="$SERVER/$REPO/releases"
            BODY="${TEST_BODY:-This is a test of the Discord announcement; no release was published.}"; PRERELEASE="false"
          fi
          # A release with no name shows its tag; one with no notes shows a plain line, not an empty embed.
          [ -n "$NAME" ] || NAME="$TAG"
          [ -n "$BODY" ] || BODY="(no release notes)"

          # An embed description holds 4096 characters; leave room for the cut-off note.
          if [ "${#BODY}" -gt 3500 ]; then
            BODY="${BODY:0:3500}"$'\n\n'"...the notes continue on the release page."
          fi

          if [ "$PRERELEASE" = "true" ]; then KIND="prerelease"; COLOR=15105570; else KIND="release"; COLOR=3066993; fi

          payload=$(jq -n \
            --arg title "$NAME" --arg url "$URL" --arg body "$BODY" --arg tag "$TAG" --arg kind "$KIND" \
            --arg repo "$REPO" --argjson color "$COLOR" \
            '{ username: "Releases", allowed_mentions: { parse: [] },
               embeds: [ { title: $title, url: $url, description: $body, color: $color,
                           footer: { text: ($repo + " " + $tag + " (" + $kind + ")") } } ] }')

          if [ "$DRY_RUN" = "true" ]; then
            echo "DRY RUN, nothing posted. Payload:"
            echo "$payload" | jq .
            echo "description length: $(echo "$payload" | jq '.embeds[0].description | length'); allowed_mentions.parse entries: $(echo "$payload" | jq '.allowed_mentions.parse | length')"
            exit 0
          fi

          code=$(curl -sS -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -d "$payload" "$WEBHOOK_URL")
          echo "Discord answered HTTP $code (204 means accepted)"
          [ "$code" = "204" ] || { echo "::error::Discord did not accept the message (HTTP $code)"; exit 1; }
