name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # Fast, hermetic, and the gate for every push and pull request.
  build-and-test:
    name: Build and unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      # -warnaserror is the point: the repo's zero-warning policy is enforced
      # here rather than left to local discipline.
      - name: Build
        run: dotnet build --configuration Release --no-restore -warnaserror

      # --settings is not optional: without it the source-generated *.g.cs files
      # swamp the hand-written SDK and the coverage number means nothing.
      - name: Unit tests
        run: >
          dotnet test TcgDex.CSharpSdk.Tests/TcgDex.CSharpSdk.Tests.csproj
          --configuration Release --no-build --framework net10.0
          --logger "trx;LogFileName=unit-tests.trx"
          --collect:"XPlat Code Coverage"
          --settings coverlet.runsettings
          --results-directory ./TestResults

      # The XPlat collector reports coverage but cannot gate on it, so both
      # thresholds are enforced here.
      #
      # Line and branch are gated separately because they answer different
      # questions. A line holding `flipped ? a : b` is fully line-covered the
      # first time it runs, while half its behaviour has never been tested — so
      # line coverage alone can sit near 100% with real logic unexercised.
      #
      # Line ceiling is 99.76% (two provably unreachable lines); branch sits at
      # 96.06%, the remainder being null-coalescing defaults and guards made
      # unreachable by an earlier check.
      - name: Coverage thresholds
        shell: pwsh
        run: >
          ./scripts/Check-Coverage.ps1
          -ResultsDirectory ./TestResults
          -Threshold 99.5
          -BranchThreshold 95

      # The integration project holds JsonShape, the comparison engine every
      # fixture-drift verdict is derived from. Its own tests need no network, so
      # gating them behind the weekly live job would mean the thing that decides
      # whether the API changed was itself only checked once a week.
      #
      # TestCategory!=Integration is what separates them: the live fixtures
      # inherit the category from LiveApiFixture, JsonShapeTests does not.
      - name: Offline tests in the integration project
        run: >
          dotnet test TcgDex.CSharpSdk.IntegrationTests/TcgDex.CSharpSdk.IntegrationTests.csproj
          --configuration Release --no-build
          --filter "TestCategory!=Integration"
          --logger "trx;LogFileName=integration-offline.trx"
          --results-directory ./TestResults

      - name: Verify the package builds
        run: dotnet pack TcgDex.CSharpSdk/TcgDex.CSharpSdk.csproj --configuration Release --no-build --output ./artifacts

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: "**/TestResults/**"

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: ./artifacts/*.nupkg

  # macOS is claimed by inference otherwise: the package targets net8.0 and
  # net10.0, which run there, and nothing proved it. Free and unlimited on
  # GitHub-hosted runners for public repositories — no Apple Developer
  # membership is involved, since that is for code signing and the App Store,
  # not for running tests.
  #
  # Unit tests only. Coverage and the package gate belong to the ubuntu job;
  # repeating them here would double CI time to re-prove what is already proven.
  macos-test:
    name: Unit test on macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore -warnaserror

      - name: Unit tests
        run: >
          dotnet test TcgDex.CSharpSdk.Tests/TcgDex.CSharpSdk.Tests.csproj
          --configuration Release --no-build --framework net10.0
          --logger "trx;LogFileName=macos-tests.trx"
          --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-test-results
          path: ./TestResults/*.trx

  # The netstandard2.0 assembly is a contract that never executes on its own, so
  # without this job it ships build-verified and never run. .NET Framework
  # resolves that asset, which makes a net472 run the only way to execute
  # exactly the DLL a Unity or WinForms consumer receives.
  #
  # A separate Windows job rather than a matrix on the job above: net472 needs
  # mono off Windows, GitHub's ubuntu runners do not have it, and vstest aborts
  # the whole run rather than skipping that one framework. Coverage is collected
  # on ubuntu only — coverlet does not instrument the .NET Framework run — so
  # this job asserts behaviour and the other one holds the gate.
  framework-test:
    name: Unit test on .NET Framework
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore -warnaserror

      # net472 explicitly. The net8.0 and net10.0 runs are the ubuntu job's
      # responsibility, and repeating them here would double CI time to
      # re-prove what is already proven.
      - name: Unit tests
        run: >
          dotnet test TcgDex.CSharpSdk.Tests/TcgDex.CSharpSdk.Tests.csproj
          --configuration Release --no-build --framework net472
          --logger "trx;LogFileName=framework-tests.trx"
          --results-directory ./TestResults

      # Distinct artifact name from the ubuntu job's. Two jobs uploading to the
      # same name is an error on upload-artifact v4+, and this job produces no
      # package, so it uploads results only.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: framework-test-results
          path: "**/TestResults/**"

  # Proves the AOT-compatibility claim. Runs on Windows because that is where
  # the SDK is developed, and the linker quirks are platform-specific.
  aot-smoke-test:
    name: Native AOT smoke test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # windows-latest ships the MSVC toolchain, but vswhere.exe is not on PATH
      # by default and the ILCompiler targets invoke it unqualified.
      - name: Put vswhere on PATH
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "C:\Program Files (x86)\Microsoft Visual Studio\Installer"

      - name: Publish with Native AOT
        run: dotnet publish TcgDex.CSharpSdk.AotSmokeTest/TcgDex.CSharpSdk.AotSmokeTest.csproj --configuration Release -r win-x64

      # Runs the native binary. A non-zero exit means reflection or runtime
      # codegen has crept into the SDK.
      - name: Run the native binary
        shell: pwsh
        run: ./TcgDex.CSharpSdk.AotSmokeTest/bin/Release/net10.0/win-x64/publish/TcgDex.CSharpSdk.AotSmokeTest.exe

  # Verify that every lane actually ran its expected number of tests. This catches: a filter that
  # matched nothing (silent 0 exit), a test host that died partway (prints a truncated "Passed!"),
  # or a test disabled in one lane. Runs after all test jobs complete.
  #
  # See C3 in CONVENTIONS-HARVEST.md. PER-LANE FLOORS, not a union total across every .trx: the
  # union form has a real blind spot here specifically, because net10.0 (ubuntu, macos) and net472
  # (windows) run the identical suite by test NAME. A test silently dropped from just the net472
  # lane, while it still runs on net10.0, is invisible to a union-of-unique-names check - the name
  # still appears in the set from the other lanes. Checking each lane's own .trx independently
  # cannot have that blind spot, because it never merges names across files at all. Found and
  # fixed 2026-09-09, per PinKushin/C3-COVERAGE-LOG.md's cross-repo comparison against
  # Tf2DemoSalvage's build/assert-test-count.sh, which this mirrors.
  #
  # Floors, not exact counts: an exact match makes every added test a red build, and this repo's
  # old union total was hand-bumped twice in one week for exactly that reason (9499f9e, c879724).
  # A floor still catches a host dying mid-run or a filter matching nothing - the failures that
  # hide - without needing an edit every time a test is added.
  verify-test-coverage:
    name: Verify test coverage across all lanes
    needs: [build-and-test, macos-test, framework-test]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v7

      - name: Download all test results
        uses: actions/download-artifact@v7
        with:
          path: all-test-results

      # RAISE THIS EVERY TIME TESTS ARE ADDED, in the same commit as the tests. A
      # floor that is set once and left alone drifts further from the true count
      # with every addition, and the gap it leaves is exactly the blind spot this
      # check exists to close: if the true count grows to 600 while the floor
      # stays at 519, up to 80 tests could silently stop running and this would
      # still pass. Owner's correction, 2026-09-11: "no floors get bumped when
      # you add tests too or they are worthlessx" - a floor's advantage over an
      # exact count was never "never touch it", only "does not go red for a
      # legitimate run-to-run wobble" (see Tf2DemoSalvage's assert-test-count.sh,
      # which this mirrors). Lower a floor only when tests were deliberately
      # removed, and say why in the same commit; raise it whenever they grow.
      #
      # Measured 2026-09-11 locally (net10.0/net472 dotnet test): 522 / 11 / 522 / 517.
      # Same figures the CI lanes themselves produce - ubuntu and macOS both run
      # net10.0, and windows runs net472, exactly as measured here.
      - name: ubuntu net10.0 unit tests
        shell: pwsh
        run: ./scripts/Assert-TestCount.ps1 -ResultsDirectory ./all-test-results -FileName unit-tests.trx -Floor 522 -Label 'ubuntu net10.0'

      - name: ubuntu offline integration tests
        shell: pwsh
        run: ./scripts/Assert-TestCount.ps1 -ResultsDirectory ./all-test-results -FileName integration-offline.trx -Floor 11 -Label 'ubuntu offline integration'

      - name: macOS net10.0 unit tests
        shell: pwsh
        run: ./scripts/Assert-TestCount.ps1 -ResultsDirectory ./all-test-results -FileName macos-tests.trx -Floor 522 -Label 'macOS net10.0'

      - name: Windows net472 unit tests
        shell: pwsh
        run: ./scripts/Assert-TestCount.ps1 -ResultsDirectory ./all-test-results -FileName framework-tests.trx -Floor 517 -Label 'Windows net472'
